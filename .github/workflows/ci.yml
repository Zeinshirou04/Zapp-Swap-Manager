name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Test Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop dependencies
        shell: bash
        run: |
          if [ -f "desktop/package.json" ]; then
            cd desktop && npm ci && cd ..
          fi

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Run checks (defaults to shell set by `just`)
        run: just check

  ci-ok:
    name: ci-ok
    needs: [check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all matrix checks passed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          if [ "$CHECK_RESULT" != "success" ]; then
            echo "CI checks failed"
            exit 1
          fi
          echo "All checks (windows + ubuntu) passed successfully."
