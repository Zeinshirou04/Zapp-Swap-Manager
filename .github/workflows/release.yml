name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.3.1-beta.3)'
        required: true
        default: 'v0.3.1-beta.3'

permissions:
  contents: write

jobs:
  build-core:
    name: Build Core Service (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Core Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path "core/go.mod") {
            cd core
            $tagVersion = "${{ github.ref_name }}"
            if ("${{ inputs.tag }}" -ne "") {
              $tagVersion = "${{ inputs.tag }}"
            }
            $tagVersion = $tagVersion.TrimStart("v")
            if ($tagVersion -eq "" -or $tagVersion -eq "main") {
              $tagVersion = "0.3.1-beta.5"
            }
            go build -v -ldflags="-s -w -X main.Version=$tagVersion" -o ../dist/zapp-core.exe ./cmd/zapp-core
            cd ..
          } else {
            Set-Content -Path dist/zapp-core-placeholder.txt -Value "Core service build pipeline ready. Implement in core/."
          }

      - name: Package Core
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath zapp-core-windows-x64.zip

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapp-core-windows-x64
          path: zapp-core-windows-x64.zip

  build-desktop:
    name: Build Desktop App (Tauri / Windows)
    runs-on: windows-latest
    needs: [build-core]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Core Binary
        uses: actions/download-artifact@v4
        with:
          name: zapp-core-windows-x64
          path: core-dist

      - name: Stage Bundled Core Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources
          if (Test-Path "core-dist/zapp-core-windows-x64.zip") {
            Expand-Archive -Path "core-dist/zapp-core-windows-x64.zip" -DestinationPath "core-extracted" -Force
            Copy-Item -Path "core-extracted/zapp-core.exe" -Destination "bin/zapp-core.exe" -Force
            Copy-Item -Path "core-extracted/zapp-core.exe" -Destination "desktop/src-tauri/resources/zapp-core.exe" -Force
          }

      - name: Build Desktop Installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop
          if (Test-Path "desktop/package.json") {
            cd desktop
            npm ci
            npm run build
            npm run tauri build
            if (Test-Path "src-tauri/target/release/bundle") {
              Copy-Item -Path "src-tauri/target/release/bundle/*" -Destination "../dist-desktop" -Recurse
              if (Test-Path "src-tauri/resources/zapp-core.exe") {
                Copy-Item -Path "src-tauri/resources/zapp-core.exe" -Destination "../dist-desktop/zapp-core.exe" -Force
              }
              # Promote installers, latest.json, and signature files to dist-desktop root for release publishing
              Get-ChildItem -Path "src-tauri/target/release/bundle" -Include "*.msi","*-setup.exe" -Recurse | ForEach-Object {
                $targetName = $_.Name.Replace(" ", ".")
                Copy-Item -Path $_.FullName -Destination "../dist-desktop/$targetName" -Force
              }
              Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "latest.json" -Recurse | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination "../dist-desktop/latest.json" -Force
              }
              Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "*.sig" -Recurse | ForEach-Object {
                $targetName = $_.Name.Replace(" ", ".")
                Copy-Item -Path $_.FullName -Destination "../dist-desktop/$targetName" -Force
              }
              Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "*.zip" -Recurse | ForEach-Object {
                $targetName = $_.Name.Replace(" ", ".")
                Copy-Item -Path $_.FullName -Destination "../dist-desktop/$targetName" -Force
              }

              # Generate latest.json manifest for Tauri cloud auto-updater
              $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.sig" -Recurse | Select-Object -First 1
              if (-not $sigFile) {
                $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "*.sig" -Recurse | Select-Object -First 1
              }
              if ($sigFile) {
                $sig = (Get-Content -Path $sigFile.FullName -Raw).Trim()
                $relTag = "${{ github.ref_name }}"
                if ("${{ inputs.tag }}" -ne "") {
                  $relTag = "${{ inputs.tag }}"
                }
                $relTag = $relTag.TrimStart("v")
                if ($relTag -eq "" -or $relTag -eq "main") {
                  $relTag = "0.3.1-beta.5"
                }

                $setupFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -Recurse | Select-Object -First 1
                if (-not $setupFile) {
                  $setupFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "*-setup.exe" -Recurse | Select-Object -First 1
                }
                $installerName = if ($setupFile) { $setupFile.Name.Replace(" ", ".") } else { "Zapp.Swap.Manager_${relTag}_x64-setup.exe" }

                $latestObj = [ordered]@{
                  version = $relTag
                  notes = "Zapp Swap Manager v$relTag release"
                  pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                  platforms = @{
                    "windows-x86_64" = @{
                      url = "https://github.com/Zeinshirou04/Zapp-Swap-Manager/releases/download/v$relTag/$installerName"
                      signature = $sig
                    }
                  }
                }
                $latestObj | ConvertTo-Json -Depth 5 | Set-Content -Path "../dist-desktop/latest.json" -Encoding UTF8
                if ($relTag -match "beta|alpha|rc") {
                  Copy-Item -Path "../dist-desktop/latest.json" -Destination "../dist-desktop/latest-beta.json" -Force
                }
              }
            } elseif (Test-Path "src-tauri/target/release/zapp-desktop.exe") {
              Copy-Item -Path "src-tauri/target/release/zapp-desktop.exe" -Destination "../dist-desktop"
            }
            cd ..
          } else {
            Set-Content -Path dist-desktop/zapp-desktop-placeholder.txt -Value "Desktop build pipeline ready. Implement in desktop/."
          }

      - name: Package Desktop
        shell: pwsh
        run: |
          Compress-Archive -Path dist-desktop/* -DestinationPath zapp-desktop-windows-x64.zip

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapp-desktop-windows-x64
          path: |
            zapp-desktop-windows-x64.zip
            dist-desktop/*-setup.exe
            dist-desktop/latest.json
            dist-desktop/latest-beta.json
            dist-desktop/*.sig
            dist-desktop/*.zip

  build-mobile:
    name: Build Mobile App (Android APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        shell: bash
        run: |
          mkdir -p dist-mobile
          if [ -f "mobile/gradlew" ]; then
            cd mobile
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../dist-mobile/zapp-mobile.apk \;
            cd ..
          else
            echo "Mobile APK build pipeline ready. Implement in mobile/." > dist-mobile/zapp-mobile-placeholder.txt
          fi

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapp-mobile-android
          path: dist-mobile/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-core, build-desktop, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Release Files
        shell: bash
        run: |
          mkdir -p final-assets
          find release-assets/ -type f -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
