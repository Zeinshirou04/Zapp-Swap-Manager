# Game Swap Manager core API contract.
# Safety rule (docs/safety.md "API input"): request bodies accept only app IDs
# and whitelisted library targets — never raw filesystem paths. Paths are built
# server-side by the core daemon.
openapi: 3.0.3
info:
  title: Game Swap Manager Core API
  version: 0.1.0
  description: >
    HTTP API exposed by the always-running Go core service. Consumed by the
    Tauri desktop dashboard (local, Bearer token) and the Android mobile app
    (remote, through a Cloudflare Tunnel behind Cloudflare Access).
servers:
  - url: http://127.0.0.1:8765
    description: Local core service (desktop / development). Core binds to 127.0.0.1 only.
  - url: https://{tunnel-host}
    description: Remote core service reachable through a Cloudflare Tunnel; every request must carry a validated Cloudflare Access JWT.
    variables:
      tunnel-host:
        default: swap-manager.example.com
        description: Hostname of the Cloudflare Tunnel fronted by Cloudflare Access.

security:
  - BearerAuth: []
  - CloudflareJWT: []

paths:
  /health:
    get:
      summary: Core service health
      description: Uptime, core version, and whether a Steam process is currently running (mirrors the "backup skip when Steam is busy" check).
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: Core is up.
          content:
            application/json:
              schema:
                type: object
                required: [uptime_seconds, version, steam_running]
                properties:
                  uptime_seconds:
                    type: integer
                    format: int64
                    description: Seconds since the core service started.
                  version:
                    type: string
                  steam_running:
                    type: boolean
                    description: True when a Steam process is detected. Backups are skipped while true and the game is mid-update.
        default:
          $ref: '#/components/responses/ErrorResponse'

  /logs:
    get:
      summary: Get recent service logs
      description: Returns recent log entries captured by the core service.
      operationId: getLogs
      tags: [System]
      parameters:
        - name: limit
          in: query
          description: Maximum number of recent log lines to retrieve (default 200).
          schema:
            type: integer
            default: 200
            maximum: 1000
      responses:
        '200':
          description: Recent log lines.
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/ErrorResponse'

  /libraries/detected:
    get:
      summary: Detect Steam libraries on this machine
      description: >-
        Scans the host for Steam installations (Windows registry HKCU\Software\Valve\Steam
        and standard install paths) and returns every discovered library folder
        with drive metrics. Nothing is registered until POST /libraries.
      operationId: detectLibraries
      tags: [Libraries]
      responses:
        '200':
          description: Detected library folders; empty when no Steam installation is found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetectedLibrary'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /libraries:
    get:
      summary: List registered Steam libraries
      description: The whitelisted SSD cache and HDD master libraries known to the core.
      operationId: listLibraries
      tags: [Libraries]
      responses:
        '200':
          description: Registered libraries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Library'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Replace the library whitelist
      description: >-
        Sets the SSD cache and HDD master whitelist and persists it to the core
        config. Every path is validated server-side: it must be an absolute
        existing directory and not a filesystem root. IDs may be omitted for
        server-derived stable IDs. The response is the resulting whitelist;
        raw paths never appear in it — job references stay library IDs.
      operationId: registerLibraries
      tags: [Libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LibraryInput'
      responses:
        '200':
          description: The resulting whitelist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Library'
        '400':
          description: A candidate library failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Registration not accepted by this server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /games:
    get:
      summary: List detected games
      description: Games found in appmanifests across all registered libraries.
      operationId: listGames
      tags: [Games]
      parameters:
        - name: state
          in: query
          description: Filter by game state.
          schema:
            $ref: '#/components/schemas/GameState'
        - name: library_id
          in: query
          description: Filter by whitelisted library ID.
          schema:
            type: string
      responses:
        '200':
          description: Matching games.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /games/{app_id}:
    get:
      summary: Get a single game
      operationId: getGame
      tags: [Games]
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Game details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          description: No game with that app ID is installed in any registered library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /games/{app_id}/cover:
    get:
      summary: Get game cover artwork
      description: Streams local cover artwork or redirects to remote cover image URL.
      operationId: getGameCover
      tags: [Games]
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Cover image data.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to remote cover URL.
        '404':
          description: No cover artwork found for this game.
        default:
          $ref: '#/components/responses/ErrorResponse'

  /preferences:
    get:
      summary: Get core preferences
      description: Returns user preferences for Steam lifecycle, startup, and transfer automation.
      operationId: getPreferences
      tags: [System]
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      summary: Update core preferences
      description: Updates and persists user preferences.
      operationId: updatePreferences
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /custom-games:
    post:
      summary: Register a non-Steam game
      description: Creates a Zapp manifest and directories for a custom non-Steam game.
      operationId: createCustomGame
      tags: [Games]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library_id, install_dir]
              properties:
                name:
                  type: string
                library_id:
                  type: string
                install_dir:
                  type: string
                cover_url:
                  type: string
                swap_enabled:
                  type: boolean
                is_native_hdd:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Game registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /custom-games/{app_id}:
    put:
      summary: Update a custom game manifest
      description: Updates name, cover URL, swap eligibility, or tags for a non-Steam game.
      operationId: updateCustomGame
      tags: [Games]
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                cover_url:
                  type: string
                swap_enabled:
                  type: boolean
                is_native_hdd:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /jobs:
    get:
      summary: List queue jobs
      description: All jobs in the strictly serial FIFO queue, oldest first.
      operationId: listJobs
      tags: [Jobs]
      parameters:
        - name: status
          in: query
          description: Filter by job status.
          schema:
            $ref: '#/components/schemas/JobStatus'
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Enqueue a new job
      description: >
        Queues a promote, evict, or backup for one Steam app. Accepts only an
        app ID and a whitelisted target library ID; the core builds all
        filesystem paths and commands server-side. Raw paths are rejected with
        400. The single queue worker executes jobs serially; a promote/evict
        waits behind any running or queued backup of the same game.
      operationId: createJob
      tags: [Jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '202':
          description: Job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid request — unknown job type, unknown app ID, non-whitelisted target library, or a raw filesystem path was supplied (rejected by policy).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicting job — e.g. another job for the same game is queued, running, or expected space exceeds target free space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}:
    get:
      summary: Get a single job
      description: Status, progress, step logs, and error details.
      operationId: getJob
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Unknown job ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}/cancel:
    post:
      summary: Cancel a job
      description: >
        Cancels a queued job immediately; for a running job it signals a
        cooperative cancel. The core never leaves a game half-moved: cancel
        takes effect between journaled, idempotent steps, then the worker
        resumes or rolls back from the journal.
      operationId: cancelJob
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Cancel accepted (queued job removed, running job signalled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Unknown job ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Job already finished (succeeded, failed or cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    CloudflareJWT:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access JWT, presented on every remote request through the tunnel; the core validates it (audience and domain) before handling.
    BearerAuth:
      type: http
      scheme: bearer
      description: Shared secret token issued by the core for the local desktop UI and development use.

  parameters:
    AppId:
      name: app_id
      in: path
      required: true
      description: Steam app ID.
      schema:
        type: string
        pattern: '^[0-9]+$'
    JobId:
      name: job_id
      in: path
      required: true
      description: Queue job ID (UUID).
      schema:
        type: string
        format: uuid

  responses:
    ErrorResponse:
      description: Standard error payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LibraryType:
      type: string
      enum: [ssd_cache, hdd_master]
      description: An SSD library holding the games currently played; the HDD master holds the full backup.

    LibraryInput:
      type: object
      required: [type, path]
      properties:
        id:
          type: string
          description: Optional library ID. Omit to let the core derive a stable ID from the path.
        type:
          $ref: '#/components/schemas/LibraryType'
        path:
          type: string
          description: Absolute library directory, e.g. a folder reported by GET /libraries/detected.

    DetectedLibrary:
      type: object
      required: [id, path, drive_type, free_bytes, total_bytes]
      properties:
        id:
          type: string
          description: The stable library ID this path receives if registered via POST /libraries.
        path:
          type: string
          description: Absolute Steam library directory on this machine.
        drive_type:
          type: string
          enum: [fixed, removable, network, unknown]
        total_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64

    Library:
      type: object
      required: [id, name, type, total_bytes, free_bytes]
      properties:
        id:
          type: string
          description: Server-assigned stable identifier of the whitelisted library. The only library reference clients may send.
        name:
          type: string
          description: Human-readable label, e.g. "SSD Cache".
        type:
          $ref: '#/components/schemas/LibraryType'
        total_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64

    GameState:
      type: string
      enum: [active_ssd, storage_hdd]
      description: >-
        active_ssd: installed in an SSD cache library (playable now).
        storage_hdd: backed up on the HDD master, not installed on the SSD.

    Game:
      type: object
      required: [app_id, name, install_dir, size_bytes, state, current_library_id, build_id, backup_clean]
      properties:
        app_id:
          type: integer
          format: int64
          description: Steam app ID.
        name:
          type: string
        install_dir:
          type: string
          description: Game install directory name or safe relative path (under steamapps\common or library root), not an absolute filesystem path.
        size_bytes:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/GameState'
        current_library_id:
          type: string
          description: Whitelisted ID of the library currently holding this game's appmanifest.
        build_id:
          type: string
        last_backup_time:
          type: string
          format: date-time
          nullable: true
        last_played:
          type: string
          format: date-time
          nullable: true
          description: Last time the game was launched or played.
        backup_clean:
          type: boolean
          description: True only if build_id is unchanged and the last incremental backup found nothing to copy.
        is_custom:
          type: boolean
          description: True if this is an unmanifested or non-Steam game folder.
        cover_url:
          type: string
          nullable: true
          description: Custom cover artwork image URL or local path.
        swap_enabled:
          type: boolean
          description: True if this game can be swapped/promoted to SSD.
        has_hdd_backup:
          type: boolean
          description: True if a verified copy of this game exists on an HDD master library.
        is_native_hdd:
          type: boolean
          description: True if this game is intended to stay on HDD and not be swapped.
        tags:
          type: array
          items:
            type: string

    Preferences:
      type: object
      properties:
        close_steam_on_transfer:
          type: boolean
          description: Automatically close Steam before moving/evicting games.
        relaunch_steam_after_transfer:
          type: boolean
          description: Automatically relaunch Steam when transfer finishes.
        run_on_startup:
          type: boolean
          description: Run Zapp core on Windows startup.
        theme:
          type: string
          enum: [system, light, dark]
        relay_enabled:
          type: boolean
          description: Whether outbound WebSocket relay to homeserver is enabled.
        relay_server_url:
          type: string
          description: URL of the homeserver relay (e.g. https://zapp.example.com).
        relay_device_id:
          type: string
          description: Registered device ID on the homeserver.
        relay_device_secret:
          type: string
          description: Secret token for device authentication on the homeserver.

    JobType:
      type: string
      enum: [promote, evict, backup]
      description: >-
        promote: HDD -> SSD copy, verify, move the manifest to the SSD, keep the HDD copy.
        evict: final SSD -> HDD mirror, verify, move the manifest to the HDD, delete the SSD copy (SSD deletion happens only after the HDD copy is verified).
        backup: SSD -> HDD mirror sync.

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    CreateJobRequest:
      type: object
      description: >
        Only these three fields are accepted. The schema has no path properties
        by design: the core rejects raw filesystem paths (400) and builds all
        paths itself from whitelisted library records.
      required: [type, app_id, target_library_id]
      properties:
        type:
          $ref: '#/components/schemas/JobType'
        app_id:
          type: string
          pattern: '^[0-9]+$'
          description: Steam app ID or non-Steam deterministic numeric ID to operate on.
        target_library_id:
          type: string
          description: Whitelisted library ID that the operation targets (where the game ends up).

    Job:
      type: object
      required: [id, type, app_id, target_library_id, status, progress_percent, bytes_transferred, total_bytes, error, created_at, started_at, completed_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        app_id:
          type: string
          pattern: '^[0-9]+$'
        target_library_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        progress_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
        bytes_transferred:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
          description: Human-readable failure reason, e.g. a failed mirror guard or a Robocopy exit code of 8 or above.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        steps:
          type: array
          description: Ordered step log from the SQLite journal.
          items:
            type: object
            required: [at, message]
            properties:
              at:
                type: string
                format: date-time
              message:
                type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. "raw_path_rejected", "unknown_library", "conflict".
        message:
          type: string
        details:
          description: Optional extra context; array or object payloads.
          oneOf:
            - type: array
              items:
                type: string
            - type: object
