[package]
name = "zapp-desktop"
version = "0.1.0"
description = "Zapp Swap Manager Desktop Dashboard"
authors = ["Zeinshirou04"]
edition = "2021"

[lib]
name = "zapp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
