[package]
name = "zapp-desktop"
version = "0.3.1-beta.7"
description = "Zapp Swap Manager Desktop Dashboard"
authors = ["Zeinshirou04"]
edition = "2021"

[lib]
name = "zapp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
